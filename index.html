<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employee QR Attendance</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fa;color:#18212b}
main{max-width:540px;margin:auto;padding:18px}
.card{background:white;border-radius:14px;padding:18px;margin-bottom:14px}
h1{font-size:1.4rem;color:#16324f}
label{display:block;font-weight:bold;margin:12px 0 6px}
input,button{width:100%;box-sizing:border-box;padding:13px;border-radius:9px;font-size:1rem}
input{border:1px solid #aaa}
button{border:0;margin-top:10px;font-weight:bold}
.primary{background:#2364aa;color:white}
.secondary{background:#e8edf3}
#status{padding:12px;border-radius:9px;background:#eef2f6;white-space:pre-wrap;overflow-wrap:anywhere}
.ok{background:#e4f6e9!important;color:#14552b}
.err{background:#fff0ed!important;color:#8d2418}
.small{font-size:.88rem;color:#536273;line-height:1.4}
.hidden{display:none}
</style>
</head>
<body>
<main>
<section class="card">
<h1>Employee QR Attendance</h1>
<p class="small">Scan an employee QR code to record attendance.</p>
<label for="pin">Scanner PIN</label>
<input id="pin" type="password" inputmode="numeric"
       autocomplete="off" placeholder="Enter staff PIN">
<button id="startBtn" class="primary">Start Camera Scanner</button>
<button id="stopBtn" class="secondary hidden">Stop Scanner</button>
</section>

<section class="card">
<div id="reader"></div>
<div id="status" role="status" aria-live="polite">
Enter your PIN, then tap Start Camera Scanner.
</div>
<p class="small">The system alternates IN and OUT. Duplicate scans are blocked for 15 seconds.</p>
</section>
</main>

<iframe name="postTarget" class="hidden" title="Attendance submission"></iframe>

<form id="postForm" method="post" target="postTarget" class="hidden">
<input name="action" value="scan">
<input name="requestId" id="requestId">
<input name="qrValue" id="qrValue">
<input name="scanPin" id="scanPin">
</form>

<script>
// REPLACE this placeholder with your Apps Script deployment URL ending in /exec.
const API_URL = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_EXEC_URL_HERE";

const statusBox = document.getElementById("status");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const pinInput = document.getElementById("pin");

let scanner = null;
let busy = false;
let callbackCounter = 0;

function status(message, kind) {
  statusBox.textContent = message;
  statusBox.className = kind || "";
}

function makeRequestId() {
  if (crypto && crypto.randomUUID) {
    return crypto.randomUUID().replace(/-/g, "");
  }
  return "r" + Date.now().toString(36) +
    Math.random().toString(36).slice(2) +
    Math.random().toString(36).slice(2);
}

async function startScanner() {
  if (API_URL.includes("PASTE_YOUR_APPS_SCRIPT")) {
    status("Edit index.html and replace API_URL with your deployed /exec URL.", "err");
    return;
  }

  if (!pinInput.value.trim()) {
    status("Enter the scanner PIN first.", "err");
    pinInput.focus();
    return;
  }

  if (!window.isSecureContext ||
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia) {
    status("Camera access requires a supported browser and HTTPS. Open the published GitHub Pages URL directly in Chrome.", "err");
    return;
  }

  startBtn.disabled = true;
  status("Requesting camera permission…");

  try {
    scanner = new Html5Qrcode("reader");

    await scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 240, height: 240 } },
      onQrScanned,
      function () {}
    );

    stopBtn.classList.remove("hidden");
    status("Camera ready. Point it at an employee QR code.");
  } catch (err) {
    scanner = null;
    startBtn.disabled = false;
    status("Could not open camera: " +
      (err.message || String(err)) +
      "\nCheck Android Settings → Apps → Chrome → Permissions → Camera, and ensure system Camera access is ON.", "err");
  }
}

async function stopScanner() {
  if (scanner) {
    try {
      if (scanner.isScanning) await scanner.stop();
      scanner.clear();
    } catch (err) {}
    scanner = null;
  }

  stopBtn.classList.add("hidden");
  startBtn.disabled = false;
}

async function onQrScanned(decodedText) {
  if (busy) return;
  busy = true;

  await stopScanner();
  status("QR detected. Sending attendance record…");

  const requestId = makeRequestId();
  document.getElementById("requestId").value = requestId;
  document.getElementById("qrValue").value = decodedText.trim();
  document.getElementById("scanPin").value = pinInput.value.trim();

  const form = document.getElementById("postForm");
  form.action = API_URL;
  form.submit();

  pollResult(requestId, 0);
}

function pollResult(requestId, attempt) {
  if (attempt > 24) {
    busy = false;
    startBtn.disabled = false;
    status("No response from the server. Check the Apps Script deployment and internet connection.", "err");
    return;
  }

  const callbackName = "attendanceCallback" + (++callbackCounter);
  const script = document.createElement("script");

  window[callbackName] = function(data) {
    delete window[callbackName];
    script.remove();

    if (data && data.pending) {
      setTimeout(() => pollResult(requestId, attempt + 1), 600);
      return;
    }

    busy = false;
    startBtn.disabled = false;

    if (data && data.success) {
      status(
        data.message +
        "\n\nEmployee: " + (data.fullName || "") +
        "\nID: " + (data.employeeId || "") +
        "\nDepartment: " + (data.department || "") +
        "\nDate: " + (data.date || "") +
        "\nTime: " + (data.time || ""),
        "ok"
      );
    } else {
      status(data && data.message ? data.message : "Unrecognized server response.", "err");
    }
  };

  script.onerror = function() {
    delete window[callbackName];
    script.remove();
    setTimeout(() => pollResult(requestId, attempt + 1), 700);
  };

  script.src = API_URL +
    "?action=result&requestId=" + encodeURIComponent(requestId) +
    "&callback=" + encodeURIComponent(callbackName) +
    "&t=" + Date.now();

  document.head.appendChild(script);
}

startBtn.addEventListener("click", startScanner);
stopBtn.addEventListener("click", stopScanner);
</script>
</body>
</html>
